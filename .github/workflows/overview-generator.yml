name: GRASS GIS addon overview generator

on:
  schedule:
    - cron: "15 3 * * 0"
  workflow_dispatch:

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  generate:
    runs-on: ubuntu-latest
    container:
      image: osgeo/grass-gis:releasebranch_8_5-debian
    steps:
      - uses: actions/checkout@v5
      - name: Generate addon overview
        env:
          LOGS_URL_PATH: logs
        shell: bash
        run: |
          apt-get update
          apt-get install -y gh wget python3-pip git python3-gdal libgdal-dev pandoc
          python3 -m venv --system-site-packages /tmp/venv
          source /tmp/venv/bin/activate
          pip install -r requirements.txt
          pip install gdal=="$(gdal-config --version)"
          bash compile_addons_git.sh \
            -b /tmp/build \
            -m "$GITHUB_WORKSPACE/public" \
            -s /tmp/grass_addons \
            -w /tmp/grass_addons_repos \
            -c /tmp/addon_cache
          mkdir -p "$GITHUB_WORKSPACE/public/logs"
          cp -r /tmp/build/logs/* "$GITHUB_WORKSPACE/public/logs/"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "public"

  deploy:
    needs: generate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
